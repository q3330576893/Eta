name: Fork Debug APK

on:
  push:
    branches: [muse-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备构建环境
        uses: ./.github/actions/setup-build

      - name: 编译 Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: 还原签名密钥
        run: base64 -d keystore/eta-release.keystore.b64 > /tmp/eta-release.keystore

      - name: 编译 Release APK（R8 混淆+资源压缩，小体积）
        env:
          ETA_RELEASE_STORE_FILE: /tmp/eta-release.keystore
          ETA_RELEASE_STORE_PASSWORD: eta-fork-2026
          ETA_RELEASE_KEY_ALIAS: eta
          ETA_RELEASE_KEY_PASSWORD: eta-fork-2026
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="debug-apk-${{ github.run_number }}"
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK=$APK"
          gh release create "$TAG" "$APK" --title "Debug APK $TAG" --notes "Fork 自动构建"

      - name: 发布 Release APK（小体积）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="release-apk-${{ github.run_number }}"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK=$APK"
          ls -lh "$APK"
          gh release create "$TAG" "$APK" --title "Release APK $TAG" --notes "Fork 自动构建（R8 混淆+资源压缩）"
